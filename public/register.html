<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamspace | Create Account</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Unique Full-Screen Background Layout for Register */
        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Full screen background photo with moody dark overlay */
            background: linear-gradient(rgba(10, 10, 10, 0.75), rgba(10, 10, 10, 0.85)), url('images/slider-design.jpg') center/cover no-repeat fixed;
            padding: 40px 20px;
        }

        .register-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            padding: 50px 50px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            position: relative;
            
            /* Simple fade-in animation */
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .register-card.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Premium Accent Line */
        .register-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 5px;
            background: var(--primary);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        /* Centering the branding for the card */
        .register-card .brand-wrapper {
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .register-card .brand-logo {
            justify-content: center;
        }

        .register-card .brand-tagline {
            margin-left: 0;
            margin-top: 10px;
        }

        .register-header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .register-header h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 600;
        }

        /* Slightly distinct input styling for the card */
        .register-card .form-control {
            background: #fdfdfd;
            border: 1px solid #e8e8e8;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.01);
        }

        @media (max-width: 600px) {
            .register-card { padding: 40px 30px; }
        }
    </style>
</head>
<body>
    <div class="register-page">
        <div class="register-card" id="reg-card">
            
            <!-- Premium Branding -->
            <div class="brand-wrapper">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="var(--primary)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="9" y1="21" x2="9" y2="9"></line>
                    </svg>
                    <span>Dreamspace</span>
                </div>
                <div class="brand-tagline">INTERIORS &bull; ARCHITECTURE &bull; DESIGN</div>
            </div>
            
            <!-- Headers -->
            <div class="register-header">
                <h2>Create Account</h2>
                <p class="subtitle" style="color: var(--text-muted);">Start planning your architectural masterpiece.</p>
            </div>

            <div id="alert-box" class="alert-box"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Jane Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="jane@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a strong password" required>
                </div>
                
                <button type="submit" id="register-btn" class="btn-submit" style="margin-top: 15px;">Create My Account</button>
            </form>

            <p style="margin-top:30px; text-align:center; color:var(--text-muted);">
                Already have an account? <a href="index.html" style="color:var(--primary); font-weight:600;">Sign In here</a>
            </p>
        </div>
    </div>

    <script>
        // Trigger fade-up animation on load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('reg-card').classList.add('active');
            }, 100);
        });

        const form = document.getElementById('register-form');
        const btn = document.getElementById('register-btn');
        const alertBox = document.getElementById('alert-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Creating Account...';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password }),
                });
                const data = await res.json();

                if (data.success) {
                    if (data.user) {
                        localStorage.setItem('dreamspace_user', JSON.stringify(data.user));
                    }
                    alertBox.className = 'alert-box alert-success';
                    alertBox.style.display = 'block';
                    alertBox.textContent = 'Account created successfully! Redirecting...';
                    setTimeout(() => window.location.href = 'home.html', 1500);
                } else {
                    alertBox.className = 'alert-box alert-error';
                    alertBox.style.display = 'block';
                    alertBox.textContent = data.message || 'Registration failed.';
                    btn.disabled = false;
                    btn.textContent = 'Create My Account';
                }
            } catch (err) {
                alertBox.className = 'alert-box alert-error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Network error. Please try again.';
                btn.disabled = false;
                btn.textContent = 'Create My Account';
            }
        });
    </script>
</body>
</html>
