<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamspace | Login</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
    <style>
        body { 
            background: linear-gradient(rgba(26,26,26,0.8), rgba(26,26,26,0.9)), url('https://images.unsplash.com/photo-1556912172-45b7abe8b7e1?auto=format&fit=crop&w=1920&q=80') center/cover fixed; 
        }
        .login-container {
            padding-top: 12vh;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .login-box {
            max-width: 450px;
            width: 100%;
            padding: 3rem 2rem;
        }
        .form-input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-light);
            border-radius: 6px;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }
        .form-input:focus {
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.1);
        }
        .login-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
        }
        .login-footer a {
            color: var(--gold);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">DREAMSPACE</div>
        <div class="links">
            <a href="/index.html" class="active">Login</a>
        </div>
    </nav>

    <main class="login-container">
        <div class="glass-panel login-box">
            <h2 style="color: var(--gold); font-size: 2.5rem; margin-bottom: 1.5rem; text-align: center;">Welcome Back</h2>
            
            <form id="login-form">
                <div style="text-align: left;">
                    <label style="color: var(--gold); font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase;">Email Address</label>
                    <input type="email" class="form-input" placeholder="admin@dreamspace.com" required>
                </div>
                
                <div style="text-align: left;">
                    <label style="color: var(--gold); font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase;">Password</label>
                    <input type="password" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Sign In</button>
            </form>

            <p id="login-feedback" style="color: #4CAF50; margin-top: 15px; display: none; font-weight: bold; text-align: center;"></p>
            
            <div class="login-footer">
                Don't have an account? <a href="#">Create one</a>
            </div>
        </div>
    </main>
<script src="/app.js"></script>
    <script>
        // Redirects to the Home page upon login
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const btn = this.querySelector('button');
            const feedback = document.getElementById('login-feedback');
            
            btn.style.display = 'none';
            feedback.style.display = 'block';
            feedback.textContent = '✓ Authentication successful! Redirecting...';
            
            // Wait 1.5 seconds so the evaluator sees the success message, then redirect
            setTimeout(() => {
                window.location.href = '/home.html';
            }, 1500);
        });
    </script>
</body>
</html>
