<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamspace | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-page">
        <!-- Left: Visual -->
        <div class="login-visual">
            <video autoplay muted loop playsinline webkit-playsinline preload="auto" poster="images/interior-hero.jpg">
                <source src="images/hero-video.mp4" type="video/mp4">
            </video>
            <div class="login-overlay"></div>
            <div class="login-visual-text">
                <div class="hero-tagline">ARCHITECTURAL EXCELLENCE</div>
                <h2>Welcome to<br><span>Dreamspace</span></h2>
                <p>Where imagination meets bespoke architecture.</p>
            </div>
        </div>

        <!-- Right: Form -->
        <div class="login-form-panel">
            <div class="brand-wrapper">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="var(--primary)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="9" y1="21" x2="9" y2="9"></line>
                    </svg>
                    <span>Dreamspace</span>
                </div>
                <div class="brand-tagline">INTERIORS &bull; ARCHITECTURE &bull; DESIGN</div>
            </div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to access your design dashboard.</p>

            <div id="alert-box" class="alert-box"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@dreamspace.com" value="admin@dreamspace.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" value="password123" required>
                </div>
                <button type="submit" id="login-btn" class="btn-submit">Sign In</button>
            </form>

            <p style="margin-top:24px; text-align:center; color:var(--text-muted);">
                Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:600;">Create one</a>
            </p>
            <p style="margin-top:12px; text-align:center;">
                <a href="home.html" style="color:var(--text-muted); font-size:0.9rem;">Back to Homepage</a>
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const btn = document.getElementById('login-btn');
        const alertBox = document.getElementById('alert-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                const data = await res.json();

                if (data.success) {
                    if (data.user) {
                        localStorage.setItem('dreamspace_user', JSON.stringify(data.user));
                    } else {
                        localStorage.setItem('dreamspace_user', JSON.stringify({ email }));
                    }
                    alertBox.className = 'alert-box alert-success';
                    alertBox.style.display = 'block';
                    alertBox.textContent = 'Login successful! Redirecting...';
                    setTimeout(() => window.location.href = 'home.html', 1200);
                } else {
                    alertBox.className = 'alert-box alert-error';
                    alertBox.style.display = 'block';
                    alertBox.textContent = data.message || 'Invalid credentials.';
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }
            } catch (err) {
                alertBox.className = 'alert-box alert-error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Network error. Please try again.';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        // ─── iOS Safari Video Autoplay Helper ───
        document.querySelectorAll('video').forEach(vid => {
            vid.muted = true;
            const playPromise = vid.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    const playOnTouch = () => {
                        vid.play().catch(() => {});
                        window.removeEventListener('touchstart', playOnTouch);
                    };
                    window.addEventListener('touchstart', playOnTouch, { passive: true });
                });
            }
        });
    </script>
</body>
</html>
